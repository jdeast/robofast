name: Tests

on:
  push:
    branches: [master]
  # No `branches:` filter: a PR against any base (including stacked PRs) gets
  # CI, and retargeting a PR never leaves it with "no checks reported".
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run for the previous push; pushes to
# master always run to completion.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # NOTE ON JOB NAMES: a branch rule should require the check named `test`
  # (the gate job at the bottom). A matrix job reports one check per
  # combination ("pytest (3.12)", ...), so requiring those would break every
  # time the matrix changes; the gate's name stays stable.

  # Fast tier: pure-Python fakes and an in-process weather server, no
  # simulator. Covers S1-S4 on fakes plus the owner/supervisor unit tests.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # The fast tier takes ~13-14 min serially (1474 tests, 2026-11-01); 15
    # cancelled PR #59's 3.12 and 3.14 jobs just short of the end.
    timeout-minutes: 30
    # Data robofast downloads from Zenodo (robofast/zenodo.py; the Gaia
    # DR3 extracts are CC BY-NC, so not in this BSD repository) land here,
    # and the cache step below keeps them between runs: Zenodo is a free
    # academic host, so CI fetches each pinned file once per pin change.
    env:
      ROBOFAST_DATA_DIR: "~/.cache/robofast/data"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group test
      # Keyed on the one file that holds every Zenodo pin: a new pin is a new
      # entry, and restore-keys brings back the files that did not change.
      # Until a record is pinned there is nothing to fetch, and the tests
      # that need real Gaia data skip (tests/core/skydata.py).
      - name: Cache the Zenodo downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/data
          key: zenodo-${{ runner.os }}-${{ hashFiles('robofast/zenodo_assets.py') }}
          restore-keys: |
            zenodo-${{ runner.os }}-
      - name: Fetch the pinned Zenodo data
        continue-on-error: true
        run: python -m robofast.zenodo fetch
      # In parallel (pytest-xdist, one worker per runner core): ~4x faster
      # than serial, and it keeps the tests honest about shared state.
      - name: Run unit tests
        run: python -m pytest -n auto -m "not alpaca_sim and not e2e" --durations=10

  # Integration tier: the same scenarios against the official ASCOM Alpaca
  # OmniSimulators (Linux x64 build, pinned and checksum-verified).
  alpaca-sim:
    name: alpaca-sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group test
      - name: Cache the OmniSim download
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/omnisim
          key: omnisim-${{ runner.os }}-${{ hashFiles('scripts/fetch_omnisim.sh') }}
      - name: Fetch OmniSim
        run: |
          set -euo pipefail
          bin=$(scripts/fetch_omnisim.sh "$HOME/.cache/robofast/omnisim" | tail -1)
          echo "ROBOFAST_OMNISIM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run simulator tests
        env:
          ROBOFAST_TIMINGS_FILE: ${{ runner.temp }}/sim-timings.json
          ROBOFAST_OMNISIM_LOG: ${{ runner.temp }}/omnisim.log
        run: python -m pytest -m alpaca_sim -v -s --durations=0 tests/sim
      - name: Publish the measured bounds
        if: always()
        run: |
          f="${{ runner.temp }}/sim-timings.json"
          if [ -f "$f" ]; then
            { echo '### Simulator timings (seconds from fault to state)'; echo;
              echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload OmniSim log and timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: alpaca-sim-logs
          path: |
            ${{ runner.temp }}/omnisim.log
            ${{ runner.temp }}/sim-timings.json
          if-no-files-found: warn

  # Conformance: ConformU (pinned, checksum-verified) against every Alpaca
  # server robofast ships, each backed by its simulator: the Aqawan Dome
  # server (scripts/conformu_aqawan.py) and the FLWO 60-inch TCSGO
  # Telescope/Focuser/Dome server (scripts/conformu_tcsgo.py), the MEarth
  # South roof Dome server (scripts/conformu_mearth_roof.py), and the TRES
  # front end's calibration-stage FilterWheel/Focuser server
  # (scripts/conformu_tres_frontend.py), the 60-inch's calibration-lamp
  # Switch server on its Pulizzi simulator (scripts/conformu_pulizzi.py), and
  # the 60-inch's ADC Rotator/Switch server on its prism-motor simulator
  # (scripts/conformu_adc.py). KiwiSpec's auxiliary-device Switch and
  # FilterWheel server has its own job (conformu-kiwispec-aux): this one is
  # already close to its time limit. The PlaneWave PWI server has its own job
  # below (conformu-pwi), run in parallel: its two backends take ~20 min.
  conformu:
    name: conformu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group core
      - name: Cache the ConformU download
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/conformu
          key: conformu-${{ runner.os }}-${{ hashFiles('scripts/fetch_conformu.sh') }}
      - name: Fetch ConformU
        run: |
          set -euo pipefail
          bin=$(scripts/fetch_conformu.sh "$HOME/.cache/robofast/conformu" | tail -1)
          echo "CONFORMU_BIN=$bin" >> "$GITHUB_ENV"
      - name: ConformU against the Aqawan Dome server
        run: python scripts/conformu_aqawan.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu"
      - name: ConformU against the TCSGO Telescope, Focuser and Dome server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_tcsgo.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-tcsgo"
      - name: ConformU against the PDU Switch server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_pdu.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-pdu"
      - name: ConformU against the MEarth South roof Dome server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_mearth_roof.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-mearth-roof"
      - name: ConformU against the TRES front-end FilterWheel and Focuser server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_tres_frontend.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-tres-frontend"
      - name: ConformU against the calibration-lamp Switch server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_pulizzi.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-pulizzi"
      - name: ConformU against the ADC Rotator and Switch server
        if: ${{ !cancelled() }}
        run: python scripts/conformu_adc.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-adc"
      - name: Upload ConformU logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: conformu-logs
          path: |
            ${{ runner.temp }}/conformu
            ${{ runner.temp }}/conformu-tcsgo
            ${{ runner.temp }}/conformu-pdu
            ${{ runner.temp }}/conformu-mearth-roof
            ${{ runner.temp }}/conformu-tres-frontend
            ${{ runner.temp }}/conformu-pulizzi
            ${{ runner.temp }}/conformu-adc
          if-no-files-found: warn

  # ConformU against the PlaneWave PWI Telescope/Focuser/Rotator server on
  # its PWI4 and PWI2 simulators (scripts/conformu_pwi.py).
  conformu-pwi:
    name: conformu-pwi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group core
      - name: Cache the ConformU download
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/conformu
          key: conformu-${{ runner.os }}-${{ hashFiles('scripts/fetch_conformu.sh') }}
      - name: Fetch ConformU
        run: |
          set -euo pipefail
          bin=$(scripts/fetch_conformu.sh "$HOME/.cache/robofast/conformu" | tail -1)
          echo "CONFORMU_BIN=$bin" >> "$GITHUB_ENV"
      - name: ConformU against the PWI Telescope, Focuser and Rotator server
        run: python scripts/conformu_pwi.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-pwi"
      - name: Upload ConformU logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: conformu-pwi-logs
          path: ${{ runner.temp }}/conformu-pwi
          if-no-files-found: warn
  # ConformU against KiwiSpec's auxiliary-device Switch and FilterWheel
  # server on its serial-device simulators (scripts/conformu_kiwispec_aux.py),
  # about 8 minutes, in parallel with the other ConformU jobs.
  conformu-kiwispec-aux:
    name: conformu-kiwispec-aux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group core
      - name: Cache the ConformU download
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/conformu
          key: conformu-${{ runner.os }}-${{ hashFiles('scripts/fetch_conformu.sh') }}
      - name: Fetch ConformU
        run: |
          set -euo pipefail
          bin=$(scripts/fetch_conformu.sh "$HOME/.cache/robofast/conformu" | tail -1)
          echo "CONFORMU_BIN=$bin" >> "$GITHUB_ENV"
      - name: ConformU against the KiwiSpec aux Switch and FilterWheel server
        run: python scripts/conformu_kiwispec_aux.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-kiwispec-aux"
      - name: Upload ConformU logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: conformu-kiwispec-aux-logs
          path: ${{ runner.temp }}/conformu-kiwispec-aux
          if-no-files-found: warn
  # ConformU against the no-enclosure server (scripts/conformu_no_enclosure.py):
  # the sky Dome and the operator-duty SafetyMonitor (docs/no_enclosure.md),
  # about 3 minutes, in parallel with the other ConformU jobs.
  conformu-no-enclosure:
    name: conformu-no-enclosure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group core
      - name: Cache the ConformU download
        uses: actions/cache@v6
        with:
          path: ~/.cache/robofast/conformu
          key: conformu-${{ runner.os }}-${{ hashFiles('scripts/fetch_conformu.sh') }}
      - name: Fetch ConformU
        run: |
          set -euo pipefail
          bin=$(scripts/fetch_conformu.sh "$HOME/.cache/robofast/conformu" | tail -1)
          echo "CONFORMU_BIN=$bin" >> "$GITHUB_ENV"
      - name: ConformU against the no-enclosure Dome and SafetyMonitor server
        run: python scripts/conformu_no_enclosure.py --conformu "$CONFORMU_BIN" --out "${{ runner.temp }}/conformu-no-enclosure"
      - name: Upload ConformU logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: conformu-no-enclosure-logs
          path: ${{ runner.temp }}/conformu-no-enclosure
          if-no-files-found: warn
  # End to end: a whole simulated MINERVA RV night (docs/demo.md) on
  # simulators and fakes, the scheduler's clock compressed: calibrations,
  # autofocus, spectra fed by two telescopes, imaging, bad weather, a ToO,
  # a mount fault, the console's pause and resume, dawn. Its outputs (logs,
  # plan record, sidecars, FITS) are uploaded.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group test
      - name: Run the simulated night
        env:
          ROBOFAST_E2E_OUT: ${{ runner.temp }}/rv-night
        run: python -m pytest -m e2e -v -s --durations=0 tests/e2e
      - name: Upload the night's outputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rv-night
          path: ${{ runner.temp }}/rv-night
          if-no-files-found: warn

  # Seeded nights of faults at the shipped timings, on the virtual clock
  # (tests/core/test_fault_nights.py): a fixed range of seeds, so a failure
  # names a seed that replays the same night locally.
  fault-nights:
    name: fault-nights
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group test
      - name: Run the nights
        env:
          FAULT_NIGHTS: "20"
        run: python -m pytest -m fault_nights -n auto -v tests/core/test_fault_nights.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache the pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install "pre-commit>=4,<5"
      - name: Run the pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # Packaging: `pip install .` into a clean venv (no checkout on the path)
  # gives an importable robofast and working console scripts.
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package into a clean venv and smoke-test it
        run: scripts/check_install.sh "${{ runner.temp }}/install-venv"

  # The one check branch rules should require.
  test:
    name: test
    if: always()
    needs: [pytest, alpaca-sim, conformu, conformu-pwi, conformu-kiwispec-aux, conformu-no-enclosure, e2e, lint, install]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "pytest:     ${{ needs.pytest.result }}"
          echo "alpaca-sim: ${{ needs.alpaca-sim.result }}"
          echo "conformu:   ${{ needs.conformu.result }}"
          echo "conformu-pwi: ${{ needs.conformu-pwi.result }}"
          echo "conformu-kiwispec-aux: ${{ needs.conformu-kiwispec-aux.result }}"
          echo "conformu-no-enclosure: ${{ needs.conformu-no-enclosure.result }}"
          echo "e2e:        ${{ needs.e2e.result }}"
          echo "lint:       ${{ needs.lint.result }}"
          echo "install:    ${{ needs.install.result }}"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.alpaca-sim.result }}" = "success"
          test "${{ needs.conformu.result }}" = "success"
          test "${{ needs.conformu-pwi.result }}" = "success"
          test "${{ needs.conformu-kiwispec-aux.result }}" = "success"
          test "${{ needs.conformu-no-enclosure.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.install.result }}" = "success"
