# Lint for robofast_core. The legacy `robofast/` directory is excluded (see
# [tool.ruff] in pyproject.toml); it is kept for reference, not packaged or
# refactored.
default_install_hook_types: [pre-commit]
repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
    -   id: ruff-check
        args: [--fix, --fixable, I]
        files: ^(robofast_core|tests|scripts)/
    -   id: ruff-format
        files: ^(robofast_core|tests|scripts)/
