# Example nginx site for the request API (robofast_core/request_api.py):
# the only internet-facing robofast service. Not installed anywhere; copy
# and adapt. The host name and certificate paths are placeholders.
#
# nginx terminates TLS and forwards to the API on loopback. The API refuses
# to listen on any other address without TLS (see its module doc), and
# trusts X-Real-IP only from a loopback peer (for its audit log).
#
# The supervisor's API and the Alpaca devices are NOT proxied: they stay on
# the isolated control network.

# Per-address limit in front of the API's own per-token limits.
limit_req_zone $binary_remote_addr zone=robofast_api:10m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.observatory.example;

    ssl_certificate     /etc/letsencrypt/live/api.observatory.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.observatory.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Match the API's max_body (64 KiB by default).
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /api/ {
        limit_req zone=robofast_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx buffers the body and sends Content-Length (the API refuses
        # chunked bodies).
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8300;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.observatory.example;
    return 301 https://$host$request_uri;
}
