# Packaging for robofast (the `robofast` package).
#
#   pip install .                          # the package and its console scripts
#   pip install ".[guider-hardware]"       # plus the guider's hardware backends
#   pip install --group test               # test dependencies, run from the repo
#
# Only `robofast*` is packaged. Everything also runs uninstalled from the repository root (`python -m robofast...`,
# `pythonpath` below), which is how the tests and the deploy recipe use it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robofast"
version = "0.1.0"
description = "Robotic observatory control: Alpaca devices, safety supervisor, sequencer, scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jason Eastman" }]
keywords = ["robotic observatory", "telescope", "ASCOM Alpaca", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Keep in step with the `core` dependency group below.
dependencies = ["astropy>=6.1", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
# Keep in step with the `guider-hardware` dependency group below.
guider-hardware = ["pyserial>=3.5", "pipython>=2.10", "zwoasi>=0.2", "redis>=5"]
# Keep in step with the `sheets` dependency group below.
sheets = ["gspread>=6", "google-auth>=2"]
# Keep in step with the `serial` dependency group below.
serial = ["pyserial>=3.5"]
# Keep in step with the `alerts` dependency group below.
alerts = ["gcn-kafka>=0.3"]

[project.urls]
Homepage = "https://github.com/jdeast/robofast"

# The long-running services and device servers. Each is also
# `python -m <module>`; the two spellings run the same main().
[project.scripts]
robofast-supervisor = "robofast.supervisor_service:main"
robofast-mode = "robofast.modes:main"
robofast-sequencer = "robofast.sequencer_service:main"
robofast-when = "robofast.when:main"
robofast-weather-bridge = "robofast.weather_bridge:main"
robofast-weather-server = "robofast.weather_server:main"
robofast-request-api = "robofast.request_api:main"
robofast-console = "robofast.console.server:main"
robofast-notifier = "robofast.notifier.service:main"
robofast-guider = "robofast.guider.service:main"
robofast-kiwispec = "robofast.devices.kiwispec_service:main"
robofast-aqawan-server = "robofast.devices.aqawan_server:main"
robofast-tcsgo-server = "robofast.devices.tcsgo_server:main"
robofast-mearth-roof-server = "robofast.devices.mearth_roof_server:main"
robofast-tres-frontend-server = "robofast.devices.tres_frontend_server:main"
robofast-pdu-server = "robofast.devices.pdu_server:main"
robofast-pulizzi-server = "robofast.devices.pulizzi_server:main"
robofast-adc-server = "robofast.devices.adc_server:main"
robofast-kiwispec-aux-server = "robofast.devices.kiwispec_aux_server:main"
robofast-pwi-server = "robofast.devices.pwi_server:main"
robofast-pwi-jog = "robofast.devices.pwi_jog:main"

# Entry-point group `robofast.plugins`: a site package's plug-ins (plan types,
# observation kinds, instrument types, weather sources), each a function that
# registers its entries; robofast.plugins runs them (docs/plugins.md).
# robofast declares none here: core's own entries register without it, so
# they also work uninstalled.

[tool.setuptools.packages.find]
include = ["robofast*"]

[dependency-groups]
# pyyaml: site configs (sites/*/weather.yaml) are YAML so every limit can
# carry a comment saying where it came from (design.md 3.10).
# astropy: the Sun's altitude for the weather bridge (robofast/sun.py),
# so it agrees exactly with the same calculation made elsewhere; and target
# positions for the dispatch scheduler (robofast/sky.py).
core = ["astropy>=6.1", "httpx>=0.27", "pyyaml>=6"]
# The guider's real-hardware backends (docs/guider.md), on the guide
# computer only: SX AO (serial), PI E-518 (GCS), ZWO ASI cameras, and the
# optional Redis telemetry mirror. Every one is an optional import; the
# simulators and the tests need none of them.
guider-hardware = ["pyserial>=3.5", "pipython>=2.10", "zwoasi>=0.2", "redis>=5"]
# The live fetch of MINERVA's target-list Google Sheet
# (robofast/sites/minerva/target_sheet.py, docs/minerva_sheet.md), on the
# host that fetches it only. Optional imports; the tests use a fake client.
sheets = ["gspread>=6", "google-auth>=2"]
# Serial ports by URL (robofast/devices/serial_url.py): the KiwiSpec
# aux server's real ports (rfc2217://, socket://, local devices). Its "sim"
# ports need nothing.
serial = ["pyserial>=3.5"]
# The GCN Kafka stream for the alert service (robofast/alerts/gcn.py,
# docs/alerts.md), on the host that runs it only. An optional import; the
# tests use NASA's example notices.
alerts = ["gcn-kafka>=0.3"]
test = [
    {include-group = "core"},
    # The serial-URL path, against simulators on loopback.
    "pyserial>=3.5",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    # Parallel fast tier in CI (`-n auto`); optional locally.
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The simulator tests need OmniSim; run them with `-m alpaca_sim`.
addopts = "-ra -m 'not alpaca_sim and not e2e'"
timeout = 120
markers = [
    "virtual_time: run on a virtual-time event loop (robofast/testing/virtual_time.py): sleeps and timeouts cost nothing",
    "e2e: the whole simulated night (tests/e2e; docs/demo.md), a few minutes",
    "alpaca_sim: integration test against the ASCOM Alpaca OmniSimulators (needs ROBOFAST_OMNISIM_BIN or ROBOFAST_OMNISIM_ADDRESS)",
]
log_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# ASYNC109/110: explicit timeout parameters and poll loops are the design
# (Alpaca is a polling protocol; every await gets its own bound).
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
# The console page's inline JavaScript and CSS (no build step, docs/console.md).
"robofast/console/page.py" = ["E501"]
# Runs on the MINERVA gateway's Python 2.7 as well as 3 (docs/remote.md): no pyupgrade.
"scripts/snmp_relay.py" = ["UP"]
