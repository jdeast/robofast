# Packaging for robofast_core, the new core (distribution name `robofast`).
#
#   pip install .                          # the package and its console scripts
#   pip install ".[guider-hardware]"       # plus the guider's hardware backends
#   pip install --group test               # test dependencies, run from the repo
#
# Only `robofast_core*` is packaged. The legacy `robofast/` directory (the old
# Windows-era code) stays in the repository but is not installed. Everything
# also runs uninstalled from the repository root (`python -m robofast_core...`,
# `pythonpath` below), which is how the tests and the deploy recipe use it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robofast"
version = "0.1.0"
description = "Robotic observatory control: Alpaca devices, safety supervisor, sequencer, scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Jason Eastman" }]
keywords = ["robotic observatory", "telescope", "ASCOM Alpaca", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Keep in step with the `core` dependency group below.
dependencies = ["astropy>=6.1", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
# Keep in step with the `guider-hardware` dependency group below.
guider-hardware = ["pyserial>=3.5", "pipython>=2.10", "zwoasi>=0.2", "redis>=5"]

[project.urls]
Homepage = "https://github.com/jdeast/robofast"

# The long-running services and device servers. Each is also
# `python -m <module>`; the two spellings run the same main().
[project.scripts]
robofast-supervisor = "robofast_core.supervisor_service:main"
robofast-sequencer = "robofast_core.sequencer_service:main"
robofast-when = "robofast_core.when:main"
robofast-weather-bridge = "robofast_core.weather_bridge:main"
robofast-weather-server = "robofast_core.weather_server:main"
robofast-request-api = "robofast_core.request_api:main"
robofast-console = "robofast_core.console.server:main"
robofast-notifier = "robofast_core.notifier.service:main"
robofast-guider = "robofast_core.guider.service:main"
robofast-kiwispec = "robofast_core.devices.kiwispec_service:main"
robofast-aqawan-server = "robofast_core.devices.aqawan_server:main"
robofast-tcsgo-server = "robofast_core.devices.tcsgo_server:main"
robofast-mearth-roof-server = "robofast_core.devices.mearth_roof_server:main"
robofast-tres-frontend-server = "robofast_core.devices.tres_frontend_server:main"
robofast-pdu-server = "robofast_core.devices.pdu_server:main"
robofast-pulizzi-server = "robofast_core.devices.pulizzi_server:main"
robofast-adc-server = "robofast_core.devices.adc_server:main"

# Entry-point group `robofast.plugins`: reserved for site packages to register
# weather source types and plan types (docs/design.md 3.10). Nothing reads it
# yet.

[tool.setuptools.packages.find]
include = ["robofast_core*"]

[dependency-groups]
# pyyaml: site configs (sites/*/weather.yaml) are YAML so every limit can
# carry a comment saying where it came from (design.md 3.10).
# astropy: the Sun's altitude for the weather bridge (robofast_core/sun.py),
# so it agrees exactly with the same calculation made elsewhere; and target
# positions for the dispatch scheduler (robofast_core/sky.py).
core = ["astropy>=6.1", "httpx>=0.27", "pyyaml>=6"]
# The guider's real-hardware backends (docs/guider.md), on the guide
# computer only: SX AO (serial), PI E-518 (GCS), ZWO ASI cameras, and the
# optional Redis telemetry mirror. Every one is an optional import; the
# simulators and the tests need none of them.
guider-hardware = ["pyserial>=3.5", "pipython>=2.10", "zwoasi>=0.2", "redis>=5"]
test = [
    {include-group = "core"},
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    # Parallel fast tier in CI (`-n auto`); optional locally.
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The simulator tests need OmniSim; run them with `-m alpaca_sim`.
addopts = "-ra -m 'not alpaca_sim and not e2e'"
timeout = 120
markers = [
    "e2e: the whole simulated night (tests/e2e; docs/demo.md), a few minutes",
    "alpaca_sim: integration test against the ASCOM Alpaca OmniSimulators (needs ROBOFAST_OMNISIM_BIN or ROBOFAST_OMNISIM_ADDRESS)",
]
log_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"
# The legacy package is out of scope for the prototype's lint.
extend-exclude = ["robofast/**"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# ASYNC109/110: explicit timeout parameters and poll loops are the design
# (Alpaca is a polling protocol; every await gets its own bound).
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
# The console page's inline JavaScript and CSS (no build step, docs/console.md).
"robofast_core/console/page.py" = ["E501"]
