description: >-
  <p>Extracts of <strong>Gaia DR3</strong> (<code>gaiadr3.gaia_source</code>)
  read by <a href="https://github.com/jdeast/robofast">robofast</a>, an
  open-source robotic observatory control system, which downloads them on
  first use (pinned by size and md5) instead of shipping them in its BSD
  3-Clause repository.</p>
  <ul>
  <li><code>bright_stars.npy</code>: every Gaia DR3 star with
  <code>phot_g_mean_mag &lt; 6.5</code> (12&#8239;119 stars), brightest first;
  used for offline cone queries, pointing models and the few bright stars a
  field's tiles lack.</li>
  <li><code>test_fixture_tiles.npz</code>: every Gaia DR3 star with
  <code>G &lt; 16</code> in 30 HEALPix tiles (nested, level 7) around the
  five test fields of robofast's test suite, one array per tile.</li>
  <li><code>README.md</code>: provenance (the exact ADQL queries), formats,
  licence and acknowledgement; <code>MANIFEST.txt</code>: size and md5 of
  every file.</li>
  </ul>
  <p>All arrays are numpy structured arrays
  (<code>numpy.load(path, allow_pickle=False)</code>) with
  <code>source_id</code>, <code>ra</code>, <code>dec</code> (deg, ICRS, epoch
  J2016.0), <code>pmra</code>, <code>pmdec</code> (mas/yr), <code>g</code>
  and <code>bp_rp</code>. They were queried from the ESA Gaia archive
  (https://gea.esac.esa.int/archive/) and are rebuilt reproducibly by
  <code>python scripts/build_catalog.py bundle</code> in the robofast
  repository.</p>
