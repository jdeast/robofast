# The all-sky cameras on Mt Hopkins (robofast/allsky, docs/allsky.md).
# Each: where it is (site: latitude deg N, longitude deg E, elevation m),
# where its frames come from, a starting guess at its geometry for
# `calibrate` (centre, horizon radius px, rotation, parity), and the pixels
# that are never sky: rects [x0, y0, x1, y1], thick segments
# [xa, ya, xb, yb, half_width], rings [cx, cy, radius, half_width].
# The fitted models are <camera>.json beside this file.

ridge:
  title: SAO ridge all-sky
  url: http://linmax.sao.arizona.edu/weather/sky/last_sky.jpg
  site: [31.6803, -110.8781, 2340.0]
  width: 1040
  height: 1040
  x0: 522.0
  y0: 505.0
  horizon_px: 500.0
  cadence_s: 60.0
  rects:
    - [470, 0, 640, 32]      # "North"
    - [0, 995, 440, 1040]    # time stamp and "East"
  # The mast, from the southern horizon toward the centre (2026; in the
  # 2023 frames it crossed the lower right: 612,650 to 805,915).
  segments:
    - [556.0, 650.0, 628.0, 1000.0, 10.0]
  notes:
    - 1040x1040 grey JPEG converted from FITS at the source; one a minute, sunset to sunrise.

mmto:
  title: MMT Observatory all-sky (summit)
  url: https://skycam.mmto.arizona.edu/skycam/latest_image.jpg
  site: [31.6883, -110.8850, 2606.0]
  width: 1422
  height: 1411
  # The overlay's own altitude rings: centre (710, 705), 7.33 px/deg.
  x0: 710.0
  y0: 705.0
  horizon_px: 660.0
  cadence_s: 34.0
  rects:
    - [0, 0, 110, 34]          # Sun altitude box
    - [0, 1340, 70, 1372]      # frame counter
    - [0, 1376, 280, 1411]     # local time
    - [1255, 1336, 1422, 1372] # temperature / humidity
    - [1160, 1374, 1422, 1411] # f/ gain exposure
    - [680, 10, 740, 70]       # N
    - [680, 1342, 740, 1402]   # S
    - [14, 676, 74, 736]       # E
    - [1346, 676, 1406, 736]   # W
    - [686, 680, 790, 730]     # crosshair and its label
  # The overlay: N-S and E-W lines through the centre, the ring labels
  # along the SE radius, and the altitude rings every 10 deg.
  segments:
    - [710.0, 40.0, 710.0, 1372.0, 2.0]
    - [44.0, 705.0, 1376.0, 705.0, 2.0]
    - [650.0, 735.0, 285.0, 1125.0, 16.0]
  rings:
    - [710.0, 705.0, 73.3, 2.0]
    - [710.0, 705.0, 146.6, 2.0]
    - [710.0, 705.0, 219.9, 2.0]
    - [710.0, 705.0, 293.2, 2.0]
    - [710.0, 705.0, 366.5, 2.0]
    - [710.0, 705.0, 439.8, 2.0]
    - [710.0, 705.0, 513.1, 2.0]
    - [710.0, 705.0, 586.4, 2.0]
    - [710.0, 705.0, 659.7, 2.0]
  colour_labels: true
  label_box: [10, 110, 14, 14]
  label_vmax: 1.6
  notes:
    - 1422x1411 colour JPEG with an overlay (rings, lines, labelled bright stars, planets, Moon, Sun).

mmto-png:
