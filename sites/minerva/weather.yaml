# MINERVA site weather bridge (robofast_core.weather_bridge).
#
#   python -m robofast_core.weather_bridge --config sites/minerva/weather.yaml --shadow
#
# Limits are ported from the legacy minerva-control code,
# minerva_library/env.py (site.load_config openLimits/closeLimits and
# site.oktoopen), as used on 2026-10-30. "open" limits apply while the
# bridge's last verdict was not safe (legacy: enclosure closed), "close"
# limits while it was safe (legacy: enclosure open). Limits are in the
# source's own units; ObservingConditions values are converted to ASCOM
# units (see `conditions`). Format: docs/weather_bridge.md.
#
# NO CREDENTIALS IN THIS FILE: `credentials_file` names a file (username on
# line 1, password on line 2, the legacy credentials/webpage.txt format)
# kept outside the repository, mode 600. `~` and $VARS are expanded.
#
# Sources (JDE 2026-10-31): the site Redis server is the required primary;
# the ridge page and the cloud page are advisory backups (an "unsafe" from
# them still closes; a failed or stale page does not). Rain is evaluated
# everywhere but enforced nowhere yet: WXT-based rain (Redis and ridge) and
# the cloud page's MEarth 998 rain sentinel are all shadow-only (reported as
# "would close", IsSafe unaffected) until validated (enforce_rain; the 998
# sentinel: JDE 2026-10-31).

site:
  name: minerva
  # legacy config/site_mtHopkins.ini
  latitude: 31.680407    # deg N
  longitude: -110.878977 # deg E
  elevation: 2316.0      # m

listen: 127.0.0.1:11111
poll_interval: 60        # s between fetches of every page
evaluate_interval: 5     # s between evaluations/publishes (staleness, Sun)
server_stale_after: 60   # Alpaca IsSafe=False if the bridge stops publishing
max_clock_skew: 120      # s; a reading stamped further in the future is unknown
# JDE 2026-10-31: any rain in the last hour means closed. (Legacy
# oktoopen's comment said "1 hour"; its code held 1800 s.) Applies to
# enforced rain; shadow rain is held and reported the same way.
rain_hold: 3600

sources:
  redis:
    # The site's Redis server, db 7 = current site weather (JDE 2026-10-31).
    # Read-only: the client sends only SELECT and MGET. No auth. db 8 is an
    # older station last written 2024-06-21 -- never point this at it.
    type: redis
    url: redis://starlord.sao.arizona.edu:6379/7
    required: true
    stale_after: 300     # for `time` (as the ridge page)
    timeout: 5
    # Timestamps are local MST like `2026-10-31 02:27:20` (mjd agrees: UTC-7).
    utc_offset_hours: -7
    time_key: time
    timestamps:          # the other timestamp keys and their staleness (s)
      boltwood_time: 300
      mbolt_time: 300
    enforce_rain: false  # ACTION: validate the false-positive rate first
    # key -> field mapping. Values match the ridge page at the same moment
    # (temperature 8.7, humidity 100, pressure 22.69 vs 22.68 inHg,
    # rain_current = wxt510Rain 137.91, rain = totalRain 2240.33): the same
    # station.
    fields:
      temperature:    {key: temperature, unit: degC}
      humidity:       {key: humidity, unit: percent}
      dewpoint:       {key: dew, unit: degC}
      pressure:       {key: pressure, unit: inHg}
      # UNITS NOT ESTABLISHED. At capture Redis said wind 11.3 / gust 38.4
      # while the ridge page said 7.21 / 20.38 mph: 11.3 km/h = 7.02 mph,
      # so km/h fits the mean wind (gusts differ in averaging window). The
      # MEarth station (same WXT keys: rain/hail intensity and duration)
      # reported km/h in legacy getWeatherMearth. If it is really mph this
      # reads wind 1.6x low -- the ridge page's mph limits still apply while
      # it answers. Check in shadow mode (compare with ridge windSpeed).
      wind:           {key: wind, unit: km/h, to: mph}
      wind_gust:      {key: wind_gust, unit: km/h, to: mph}
      wind_direction: {key: wind_direction, unit: deg}
      # Cumulative counters (mm, as wxt510Rain / totalRain on the ridge page).
      rain_wxt:       {key: rain_current}
      rain_total:     {key: rain}
      rain_intensity: {key: rain_intensity, unit: mm/h}  # WXT, current
      rain_duration:  {key: rain_duration}               # s, cumulative
      hail:           {key: hail}                        # cumulative
      hail_intensity: {key: hail_intensity}
      hail_duration:  {key: hail_duration}
      # Cloud sensors (sky - ambient, degC). Confirmed (JDE 2026-10-31):
      # m_bolt = the MEarth cloud sensor (timed by mbolt_time), aurora = the
      # Aurora sensor; a_sky equalled aurora at capture. boltwood (timed by boltwood_time) read -0.0 = legacy's
      # "sensor down" 0.0; which sensor it is is unknown, so it is logged
      # but not limited. 0.0 is "down" for all, as legacy.
      mearth:         {key: m_bolt, time: mbolt_time, missing_values: [0.0]}
      boltwood:       {key: boltwood, time: boltwood_time, missing_values: [0.0]}
      aurora:         {key: aurora, missing_values: [0.0]}
      a_sky:          {key: a_sky, missing_values: [0.0]}
      # The FLWO 48" observers' MEarth cloud limit (rts2 me_sky_limit,
      # which legacy fetched with getskylimit.sh); see dynamic_limits.
      sky_limit:      {key: sky_limit}
    limits:
      # The ridge page's legacy limits (wind converted to mph above).
      wind:           {open: [0.0, 30.0],     close: [0.0, 35.0]}
      wind_gust:      {open: [0.0, 35.0],     close: [0.0, 40.0]}
      humidity:       {open: [0.0, 75.0],     close: [0.0, 80.0]}
      temperature:    {open: [-20.0, 50.0],   close: [-30.0, 60.0]}
      dewpoint:       {open: [-100.0, 100.0], close: [-100.0, 100.0]}
      wind_direction: {open: [0.0, 360.0],    close: [0.0, 360.0]}
      pressure:       {open: [0, 2000],       close: [0, 2000]}
      # Cloud limits as for the cloud page's MEarth and Aurora columns.
      mearth:         {open: [-999, -40.0], close: [-999, -38.0]}
      aurora:         {open: [-999, -32.0], close: [-999, -31.0]}
    groups:
      sky: [mearth, aurora]
    dynamic_limits:
      # Legacy domeControl.py read me_sky_limit every 30 min (default -38)
      # and applied it to the MEarth sensor only: close limit = sky_limit,
      # open limit = sky_limit - 2. Off by default (JDE 2026-10-31); outside
      # `range` the static limits apply.
      mearth: {enabled: false, field: sky_limit, side: high,
               open_offset: -2.0, close_offset: 0.0, range: [-50.0, -25.0]}
    rain_rates:
      # Rain while the WXT intensity is above 0 (any rain).
      rain_intensity: 0.0
      hail_intensity: 0.0
    rain_counters:
      rain_wxt:   {window: 600, threshold: 0.1}
      rain_total: {window: 600, threshold: 0.1}

  ridge:
    type: minerva.ridge
    url: http://linmax.sao.arizona.edu/weather/weather.cur_cond
    # Legacy sent the cloud page's credentials here too; the page answers
    # without them (2026-10-30). Add credentials_file if that changes.
    # Advisory backup since 2026-10-31: its limits still close the roof,
    # but a failed or stale page does not.
    required: false
    enforce_rain: false  # the same WXT510 as Redis
    # legacy limits['date']: utcnow() - 5 min (but frozen at startup there)
    stale_after: 300
    timeout: 10
    limits:
      # Units: wind in mph (legacy plotweather.py labels), temperatures in C,
      # humidity in %, barometer in inHg (22.68 at 2316 m is ~768 hPa, which
      # matches the standard atmosphere; plotweather's "mbar" label is wrong).
      windSpeed:            {open: [0.0, 30.0],     close: [0.0, 35.0]}
      windGustSpeed:        {open: [0.0, 35.0],     close: [0.0, 40.0]}
      outsideHumidity:      {open: [0.0, 75.0],     close: [0.0, 80.0]}
      outsideTemp:          {open: [-20.0, 50.0],   close: [-30.0, 60.0]}
      # The next three are sanity ranges in legacy too (garbage detection).
      outsideDewPt:         {open: [-100.0, 100.0], close: [-100.0, 100.0]}
      windDirectionDegrees: {open: [0.0, 360.0],    close: [0.0, 360.0]}
      barometer:            {open: [0, 2000],       close: [0, 2000]}
      # Legacy also "limited" wxt510Rain and totalRain, but they are
      # cumulative totals and the limits were 99999 / 999999 / 100000, so rain
      # detection was effectively off. They are rain counters below instead.
    rain_counters:
      # NEW (not in legacy): rain = the counter rose by >= threshold within
      # `window` seconds of data time. A decrease is a counter reset.
      # Units: wxt510Rain in mm (plotweather.py); totalRain unverified (mm
      # assumed). Legacy disabled wxt510Rain-based rain detection because the
      # WXT510 impact sensor "can be triggered by wind"; tune the threshold
      # in shadow mode before relying on it.
      wxt510Rain: {window: 600, threshold: 0.1}
      totalRain:  {window: 600, threshold: 0.1}

  cloud:
    type: minerva.sky_temps
    url: http://linmax.sao.arizona.edu/temps/sky_temps_now
    credentials_file: ~/.config/robofast/sao-weather.credentials
    # Advisory backup since 2026-10-31 (see ridge).
    required: false
    # Legacy enforced MEarth's 998.0 rain sentinel ("much more reliable than
    # wxt510Rain"); JDE 2026-10-31: shadow only here (evaluated, held and
    # reported as "would close", but IsSafe is unaffected).
    enforce_rain: false
    # legacy limits['cloudDate']: utcnow() - 6 min (page updates every 5 min)
    stale_after: 360
    timeout: 10
    # The page's timestamps are local MST (Arizona has no DST): legacy +7 h.
    utc_offset_hours: -7
    # Which sensor each value column is, by total field count (2 date/time
    # fields first). From legacy getWeather; a count not listed here makes
    # every cloud sensor unknown instead of shifting columns.
    layouts:
      6: [mearth, hat, aurora, minerva]
      5: [mearth, aurora, minerva]
      # legacy read column 3 as MEarth, then forced it to "down":
      # "MEarth disabled as of 2022-02-03".
      4: [null, aurora]
    sensors:
      # Calibration: value = (raw - offset) / scale, compared with limits in
      # MEarth-equivalent degrees C (legacy cloudScale; it compared raw values
      # with limit * scale + offset, which is the same test).
      # missing_values: legacy mapped 0.0 (all sensors) and -999.9 (MEarth)
      # to 999 = "sensor down"; -999.9 is treated as down for all here.
      mearth:
        scale: 1.0
        offset: 0.0
        missing_values: [0.0, -999.9]
        # legacy oktoopen: "MearthCloud reports 998.0 when it's raining"
        rain_values: [998.0]
      hat:
        scale: 0.98378265
        offset: 1.2899657
        missing_values: [0.0, -999.9]
      aurora:
        # legacy uses raw limits for Aurora (its calibrated form, scale
        # 0.89876588, offset 6.8789744, is commented out), so no calibration.
        scale: 1.0
        offset: 0.0
        missing_values: [0.0, -999.9]
      minerva:
        # likewise raw limits (commented-out calibration: 0.74102145, 0.058437186)
        scale: 1.0
        offset: 0.0
        missing_values: [0.0, -999.9]
    limits:
      # legacy openCloudLimit = -40, closeCloudLimit = -38 (calibrated);
      # Aurora and MINERVA hard-coded raw -32/-31 and -24/-23.
      mearth:  {open: [-999, -40.0], close: [-999, -38.0]}
      hat:     {open: [-999, -40.0], close: [-999, -38.0]}
      aurora:  {open: [-999, -32.0], close: [-999, -31.0]}
      minerva: {open: [-999, -24.0], close: [-999, -23.0]}
    groups:
      # legacy oktoopen: the first sensor that is up decides, in this order;
      # all down is "not OK to open".
      sky: [mearth, hat, minerva, aurora]

  sun:
    type: sun
    required: true
    limits:
      # legacy oktoopen overrides limits['sunAltitude'] to [-90, 6] (both
      # open and close) unless a sunOverride file exists; the 15 deg in
      # load_config is never used. `altitude` is apparent (refracted), as
      # legacy's PyEphem altitude was; `altitude_geometric` is logged too.
      altitude: {open: [-90.0, 6.0], close: [-90.0, 6.0]}
    # Refraction as legacy: ephem.Observer's default pressure and temperature
    # (legacy never set them). Agrees with PyEphem to 0.002 deg at +6 deg.
    pressure_hpa: 1010.0
    temperature_c: 15.0

  mearth_weather:
    # legacy getWeatherMearth; disabled there since 2022-10-20 ("MEarth
    # weather station down") and the page returned nothing on 2026-10-30.
    # Kept (disabled, advisory, no limits) so it can be watched in shadow
    # mode if it returns. Units per legacy: wind km/h, barometer mmHg.
    enabled: false
    type: minerva.mearth
    url: http://mearth.sao.arizona.edu/weather/now
    required: false
    stale_after: 600  # legacy rejected data older than 10 min

# ASCOM ObservingConditions members -> source field, in the field's unit
# (converted to ASCOM units: degC, %, m/s, hPa, mm/h, deg).
conditions:
  temperature:    {source: redis, field: temperature, unit: degC}
  humidity:       {source: redis, field: humidity, unit: percent}
  dewpoint:       {source: redis, field: dewpoint, unit: degC}
  pressure:       {source: redis, field: pressure, unit: inHg}
  windspeed:      {source: redis, field: wind, unit: mph,
                   description: "site Redis wind, read as km/h (unit unverified)"}
  windgust:       {source: redis, field: wind_gust, unit: mph,
                   description: "site Redis wind_gust, read as km/h (unit unverified)"}
  winddirection:  {source: redis, field: wind_direction, unit: deg}
  rainrate:       {source: redis, field: rain_intensity, unit: mm/h,
                   description: "site Redis rain_intensity (WXT510)"}
  skytemperature: {source: redis, field: sky, unit: degC,
                   description: "first available Redis cloud sensor (MEarth m_bolt, then Aurora)"}
